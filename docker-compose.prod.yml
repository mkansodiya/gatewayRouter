version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gateway_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-gateway_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gateway_password}
      POSTGRES_DB: ${DB_NAME:-gateway_router}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gateway_user} -d $${POSTGRES_DB:-gateway_router}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gateway_backend_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-gateway_user}:${DB_PASSWORD:-gateway_password}@db:5432/${DB_NAME:-gateway_router}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://grdash.pay2mall.com}
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://grapi.pay2mall.com}
    container_name: gateway_frontend_prod
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata_prod:
